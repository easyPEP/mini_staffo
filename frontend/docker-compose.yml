services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - ../api/public/v1/openapi.json:/openapi.json:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - NODE_ENV=development
      - OPENAPI_URL=/openapi.json
