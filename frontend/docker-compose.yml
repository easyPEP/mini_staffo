services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - '5173:5173'
    volumes:
      - .:/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - NODE_ENV=development
      - OPENAPI_URL=http://host.docker.internal:3000/v1/openapi.json
