services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mini_staffomatic_development
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_PASSWORD: password
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle

  docs:
    image: redocly/redoc
    ports:
      - "8080:80"
    environment:
      SPEC_URL: /openapi.json
    volumes:
      - ./public/v1/openapi.json:/usr/share/nginx/html/openapi.json
    depends_on:
      - api

volumes:
  mysql_data:
  bundle_cache:
